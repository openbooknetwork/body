# How the body breaks down food and absorbs it, from the mouth to the rectum. It covers the teeth, swallowing, the stomach, the liver, gallbladder and pancreas, and the small and large intestines, and ends with the experiments of Beaumont and Pavlov.
story.summary: "Bedenin besini ağızdan rektuma kadar nasıl parçalayıp emdiği. Dişleri, yutmayı, mideyi, karaciğer, safra kesesi ve pankreası, ince ve kalın bağırsağı anlatır ve Beaumont ile Pavlov’un deneyleriyle biter."

# The digestive system
story.title: "Sindirim sistemi"
