title: "Blood from the gut"
sources: ["Arthur Guyton and John Hall, Textbook of Medical Physiology, 13th ed. (2016), ch. 71.", "Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), chapter on the liver."]
beden:
  camera: front
  look: portal-vein
  distance: 0.5
  layers: [liver, portal, veins, skeleton, organs]
  parts:
    highlight: [superior-mesenteric-vein, splenic-vein, portal-vein, hepatic-veins, inferior-vena-cava]
    ghost: [liver, skeleton, spleen]
    hide: [right-kidney, left-kidney]
    flow: [superior-mesenteric-vein, portal-vein, hepatic-veins, inferior-vena-cava]
  labels:
    - { part: portal-vein, text: "portal vein" }
    - { part: superior-mesenteric-vein, text: "superior mesenteric vein" }
    - { part: splenic-vein, text: "splenic vein" }
    - { part: hepatic-veins, text: "hepatic veins" }
