# About 6 m after death, less in life
structure.facts.0.value: "Ölümden sonra yaklaşık 6 m, yaşarken daha kısa"

# Duodenum 25 cm, then jejunum two fifths and ileum three fifths of the rest
structure.facts.1.value: "On iki parmak bağırsağı 25 cm, kalanın beşte ikisi jejunum, beşte üçü ileum"

# 3 to 5 hours from the pylorus to the large intestine
structure.facts.2.value: "Pilordan kalın bağırsağa 3 ila 5 saat"

# Renewed about every 5 days
structure.facts.3.value: "Yaklaşık 5 günde bir yenilenir"
