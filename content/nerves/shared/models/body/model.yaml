# The whole body model of the nerves story, built by `beden model`. Most parts name a BodyParts3D concept. The spinal
# cord, the spinal, limb and autonomic nerves and the cranial nerves BodyParts3D lacks name Z-Anatomy element files,
# fitted to BodyParts3D's skeleton. The viewer shows, lights, ghosts or cuts parts by these ids.
