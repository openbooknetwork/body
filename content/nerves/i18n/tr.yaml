# The brain, the spinal cord and the nerves of the body. Pages cover the regions of the brain, reflexes, the nerves of the limbs and head, the autonomic system and how a nerve cell signals. The last pages tell of the experiments of Galvani, Broca, Golgi and Cajal.
story.summary: "Beyin, omurilik ve bedenin sinirleri. Sayfalar beynin bölgelerini, refleksleri, kol, bacak ve baş sinirlerini, otonom sistemi ve bir sinir hücresinin nasıl sinyal ilettiğini anlatır. Son sayfalar Galvani, Broca, Golgi ve Cajal’ın deneylerine ayrılmıştır."

# The nervous system
story.title: "Sinir sistemi"
