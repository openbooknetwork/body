title: "The basal ganglia"
sources: ["Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), chapter on the basal ganglia.", "Arthur Guyton and John Hall, Textbook of Medical Physiology, 13th ed. (2016), ch. 57.", "James Parkinson, An Essay on the Shaking Palsy (London, 1817)."]
