title: "From cortex to cord"
sources: ["Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), chapters on the internal organization of the spinal cord and on the brainstem.", "Arthur Guyton and John Hall, Textbook of Medical Physiology, 13th ed. (2016), ch. 56."]
beden:
  camera: oblique
  look: motor-pathway
  layers: [cortex, white-matter, brainstem, cerebellum, cord]
  parts:
    highlight: [left-precentral-gyrus, internal-capsules, cerebral-peduncles, pons, medulla-oblongata, corticospinal-tracts]
    ghost: [cerebral-cortex, left-white-matter, right-white-matter, corpus-callosum, fornix, cerebellum, spinal-cord, spinal-grey-matter]
    flow: [left-precentral-gyrus, internal-capsules, cerebral-peduncles, pons, medulla-oblongata, corticospinal-tracts]
  labels:
    - { part: left-precentral-gyrus, text: "precentral gyrus" }
    - { part: internal-capsules, text: "internal capsule" }
    - { part: medulla-oblongata, text: "pyramids" }
    - { part: corticospinal-tracts, text: "corticospinal tract" }
