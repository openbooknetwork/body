title: "The brainstem"
sources: ["Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), chapter on the brainstem.", "Arthur Guyton and John Hall, Textbook of Medical Physiology, 13th ed. (2016), ch. 18 and 42."]
beden:
  camera: oblique
  look: brainstem
  distance: 0.3
  layers: [brainstem, cerebellum, cortex]
