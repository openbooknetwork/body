    - { part: optic-nerves, text: "II" }
    - { part: oculomotor-nerves, text: "III" }
    - { part: trochlear-nerves, text: "IV" }
    - { part: trigeminal-nerves, text: "V" }
    - { part: abducens-nerves, text: "VI" }
    - { part: facial-nerves, text: "VII" }
    - { part: vestibulocochlear-nerves, text: "VIII" }
    - { part: glossopharyngeal-nerves, text: "IX" }
    - { part: vagus-nerves, text: "X" }
    - { part: accessory-nerves, text: "XI" }
    - { part: hypoglossal-nerves, text: "XII" }
