title: "Twelve cranial nerves"
sources: ["Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), chapter on the brainstem.", "Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), chapter on the orbit and accessory visual apparatus."]
