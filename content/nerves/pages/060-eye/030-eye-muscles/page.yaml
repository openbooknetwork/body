    - { part: trochlear-nerves, text: "trochlear nerve" }
    - { part: abducens-nerves, text: "abducens nerve" }
    - { part: superior-oblique-muscles, text: "superior oblique" }
    - { part: lateral-rectus-muscles, text: "lateral rectus" }
