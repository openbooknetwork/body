title: "Moving the eye"
sources: ["Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), chapter on the orbit and accessory visual apparatus.", "Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), chapter on the brainstem."]
beden:
