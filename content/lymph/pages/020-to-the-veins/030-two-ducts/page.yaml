title: "Where lymph meets the blood"
sources: ["Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), chapters on the neck and the mediastinum.", "Arthur Guyton and John Hall, Textbook of Medical Physiology, 13th ed. (2016), ch. 15 and 16."]
