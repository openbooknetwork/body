id: lymph
title: "The lymphatic system"
summary: "The lymphatic system collects fluid from the tissues, filters it through the lymph nodes and returns it to the blood. This story covers the lymph vessels and nodes, the spleen, thymus and bone marrow, the tonsils, and what happens when drainage fails."
cover: thoracic-duct-gray-007498
languages: [en, tr]
default_language: en
beden:
  model: body
  # the overview before the first page: the body with its lymph nodes
  overview: { camera: front, look: skin, layers: [skin, nodes], parts: { highlight: [lymph-nodes], ghost: [skin] } }
  cameras:
    front:      { direction: [0, 0.05, 1] }
    oblique:    { direction: [0.7, 0.35, 1] }
    left:       { direction: [-1, 0.1, 0.4] }
    right:      { direction: [1, 0.1, 0.4] }
    back:       { direction: [0, 0.05, -1] }
    right-side: { direction: [-1, 0.05, 0.02] }   # from the body's right, onto a midline cut of its left half
    above:      { direction: [0, 1, 0.35] }       # down onto an axial cut, the front of the body nearest the viewer
    armpit:     { direction: [0.9, -0.3, 0.7] }   # from below and to the body's left, into the left armpit
  families:
    mesentery: { color: "#e3c98a", color_dark: "#a8935f" }   # the fatty fold that carries the vessels and nodes of the small intestine
