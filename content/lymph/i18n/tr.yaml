# The lymphatic system collects fluid from the tissues, filters it through the lymph nodes and returns it to the blood. This story covers the lymph vessels and nodes, the spleen, thymus and bone marrow, the tonsils, and what happens when drainage fails.
story.summary: "Lenf sistemi dokulardaki sıvıyı toplar, lenf düğümlerinde süzer ve kana geri verir. Bu hikâye lenf damarlarını ve düğümlerini, dalak, timus ve kemik iliğini, bademcikleri ve boşalma aksadığında olanları anlatır."

# The lymphatic system
story.title: "Lenf sistemi"
