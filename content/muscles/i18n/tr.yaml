# The sliding filaments
pages.sliding-filaments.title: "Kayan filamentler"

# The muscles that move the skeleton, from the face to the feet. The story looks inside a muscle at its fibres and filaments, shows how muscles pull on bones in pairs, goes through the head, trunk, arms and legs layer by layer, and ends with Vesalius, Duchenne and the discovery of the sliding filaments.
story.summary: "İskeleti yüzden ayaklara kadar hareket ettiren kaslar. Öykü bir kasın içine, liflerine ve filamentlerine bakar, kasların kemikleri nasıl çiftler halinde çektiğini gösterir, başı, gövdeyi, kolları ve bacakları kat kat dolaşır ve Vesalius, Duchenne ve kayan filamentlerin bulunuşuyla biter."

# The muscular system
story.title: "Kas sistemi"
