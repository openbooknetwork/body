title: "Levers"
sources: ["Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), chapters on the functional anatomy of the musculoskeletal system and on the elbow and forearm."]
beden:
  camera: right-side
  look: [-0.19, 1.06, 0.07]
  distance: 0.95
  layers: [skeleton]
  parts:
    show: [biceps-brachii, brachialis]
    highlight: [biceps-brachii, brachialis]
  labels:
    - { part: right-biceps-brachii, text: "biceps" }
    - { part: right-brachialis, text: "brachialis" }
    - { part: radii, text: "radius" }
    - { part: ulnae, text: "ulna" }
