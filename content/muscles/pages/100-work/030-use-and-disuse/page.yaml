  labels:
    - { part: right-erector-spinae, text: "erector spinae" }
    - { part: right-gluteus-maximus, text: "gluteus maximus" }
    - { part: right-quadriceps, text: "quadriceps" }
    - { part: right-soleus, text: "soleus" }
