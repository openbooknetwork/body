title: "Use and disuse"
sources: ["Arthur Guyton and John Hall, Textbook of Medical Physiology, 13th ed. (2016), ch. 6 and 85.", "Gregory Adams, Vincent Caiozzo and Kenneth Baldwin, Skeletal muscle unweighting: spaceflight and ground-based models, Journal of Applied Physiology 95 (2003): 2185-2201."]
