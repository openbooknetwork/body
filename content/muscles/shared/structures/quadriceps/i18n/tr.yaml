# Rectus femoris, vastus lateralis, vastus medialis and vastus intermedius
structure.facts.0.value: "Düz uyluk kası, dış geniş kas, iç geniş kas ve ara geniş kas"

# The patella, and through the patellar ligament the tibial tuberosity
structure.facts.1.value: "Diz kapağı, patellar bağ aracılığıyla da tibia tüberozitesi"

# Femoral nerve, spinal segments L2 to L4
structure.facts.2.value: "Femoral sinir, L2 ila L4 omurilik bölütleri"

