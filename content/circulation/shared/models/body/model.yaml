  internal-carotid-arteries:   { concept: FMA3947, layer: arteries, family: oxygenated }   # from the base of the skull to the arterial circle
  # The neck from Z-Anatomy (Gauthier Kervyn, CC BY-SA 4.0), element files za-*: BodyParts3D stops the common carotids
  # 4 cm short of their fork and has neither the external carotids nor the neck part of the internal carotids. Its
  # internal carotids run about 1 cm off this one's, so a page shows one or the other.
  right-common-carotid-artery: { elements: [za-right-common-carotid-artery], layer: arteries, family: oxygenated }
  left-common-carotid-artery:  { elements: [za-left-common-carotid-artery], layer: arteries, family: oxygenated }
  external-carotid-arteries:   { elements: ["za-external-carotid-artery*"], layer: arteries, family: oxygenated }
  cervical-internal-carotid-arteries: { elements: ["za-internal-carotid-artery*"], layer: arteries, family: oxygenated }   # from the fork in the neck into the skull
  vertebral-arteries:          { elements: ["za-vertebral-artery*"], layer: arteries, family: oxygenated }   # from the subclavian to the basilar, where BodyParts3D's start 5 cm above the subclavian
  # the arteries of the brain
  basilar-artery:              { elements: [FJ1672, FJ1844], layer: brain-arteries, family: oxygenated }
  arterial-circle:             { concept: FMA50454, layer: brain-arteries, family: oxygenated }   # the communicating arteries and the first part of each posterior cerebral
  anterior-cerebral-arteries:  { concepts: [FMA50028, FMA50031], exclude: [FJ1655], layer: brain-arteries, family: oxygenated }   # FJ1655 is the anterior communicating artery, in the circle
  middle-cerebral-arteries:    { concepts: [FMA50365, FMA50368, FMA50081], layer: brain-arteries, family: oxygenated }
  posterior-cerebral-arteries: { concepts: [FMA50584, FMA50585], layer: brain-arteries, family: oxygenated }
