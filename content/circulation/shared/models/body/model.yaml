  middle-cardiac-vein:   { concept: FMA4713, layer: cardiac-veins, family: deoxygenated }
  small-cardiac-vein:    { concept: FMA4714, layer: cardiac-veins, family: deoxygenated }
  # The ductus arteriosus, which BodyParts3D does not hold, drawn as a tube through [x, y, z, radius] in metres of the
  # glTF frame (x to the left, y up, z forward), from the top of the left pulmonary artery to the underside of the arch
  ductus-arteriosus:
    layer: fetal
    family: fetal
    tube:
      - [0.028, 1.287, 0.114, 0.0035]  # inside the left pulmonary artery at its origin from the trunk
      - [0.027, 1.293, 0.104, 0.0035]
      - [0.025, 1.298, 0.093, 0.0035]  # inside the arch, on its concave underside left of the midline
  # the pulmonary loop
  pulmonary-trunk:        { concept: FMA8612, layer: pulmonary, family: deoxygenated }
  right-pulmonary-artery: { concept: FMA50872, layer: pulmonary, family: deoxygenated, exclude: [FJ2041, FJ2044] }   # two elements BodyParts3D files here sit 20 cm below the hilum
  left-pulmonary-artery:  { concept: FMA50873, layer: pulmonary, family: deoxygenated }
  pulmonary-veins:        { concept: FMA66643, layer: pulmonary, family: oxygenated }
  # The aorta and its branches. BodyParts3D files every artery downstream under the trunk it comes from, so the trunks
  # of the arch and the iliac arteries name their own element files.
  ascending-aorta:  { concept: FMA3736, layer: aorta, family: oxygenated }
  arch-of-aorta:    { concept: FMA3768, layer: aorta, family: oxygenated }
  descending-aorta: { concept: FMA3784, layer: aorta, family: oxygenated }
  abdominal-aorta:  { concept: FMA3789, layer: aorta, family: oxygenated }
