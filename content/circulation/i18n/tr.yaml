# The circulation of the blood
story.title: "Kan dolaşımı"

# One pump, two loops and some 100,000 km of vessels: the heart and its chambers, the short loop through the lungs, the aorta and every artery it feeds, the veins that bring the blood back, and the bandaged arm with which Harvey proved in 1628 that it goes round.
story.summary: "Bir pompa, iki döngü ve yaklaşık 100.000 km damar: kalp ve odacıkları, akciğerlerden geçen kısa döngü, aort ve beslediği her arter, kanı geri getiren venler ve Harvey’nin 1628’de kanın döndüğünü kanıtladığı bağlı kol."

