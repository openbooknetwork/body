# The heart, the arteries, the veins and how the blood moves through them. It follows the blood from the heart to the lungs, around the body and back, and also covers the circulation before birth and how Harvey proved in 1628 that the blood circulates.
story.summary: "Kalp, arterler, venler ve kanın bunların içinde nasıl dolaştığı. Kanı kalpten akciğerlere, bedenin her yanına ve geri izler, doğumdan önceki dolaşımı ve Harvey’nin 1628’de kanın döndüğünü nasıl kanıtladığını da anlatır."

# The circulatory system
story.title: "Dolaşım sistemi"

