id: circulation
title: "The circulation of the blood"
summary: "One pump, two loops and some 100,000 km of vessels: the heart and its chambers, the short loop through the lungs, the aorta and every artery it feeds, the veins that bring the blood back, and the bandaged arm with which Harvey proved in 1628 that it goes round."
cover: heart-front-gray-97457a
languages: [en, tr]
default_language: en
beden:
  model: body
  cameras:
    front:   { direction: [0, 0.05, 1] }
    oblique: { direction: [0.7, 0.35, 1] }
    left:    { direction: [-1, 0.1, 0.4] }
    right:   { direction: [1, 0.1, 0.4] }
    back:    { direction: [0, 0.05, -1] }
  families:
    oxygenated:   { color: "#b5352a", color_dark: "#e8695c" }   # the left heart, the aorta and every systemic artery, the pulmonary veins
    deoxygenated: { color: "#2f6fb0", color_dark: "#6fa6e0" }   # the right heart, the venae cavae and every systemic vein, the pulmonary arteries
    portal:       { color: "#6a3d9a", color_dark: "#a98bd6" }   # the hepatic portal system, between two capillary beds
    valve:        { color: "#d4a017", color_dark: "#f2c94c" }
    muscle:       { color: "#9c5b5b", color_dark: "#c48080" }   # the wall of the heart
    lung:         { color: "#d9a7a7", color_dark: "#8f6b6b" }
    organ:        { color: "#b08968", color_dark: "#8a6a4f" }
    bone:         { color: "#e8e2d2", color_dark: "#6f6a5e" }
    skin:         { color: "#f2d9c4", color_dark: "#5a5048" }
