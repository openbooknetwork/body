title: "The portal system"
sources: ["Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), ch. 68.", "Arthur Guyton and John Hall, Textbook of Medical Physiology, 13th ed. (2016), ch. 71."]
beden:
  camera: front
  look: portal-system
  distance: 0.8
  layers: [organs, portal, veins, skeleton]
