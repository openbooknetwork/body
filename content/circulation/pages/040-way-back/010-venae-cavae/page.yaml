title: "The venae cavae"
sources: ["Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), chapters on the great vessels, the mediastinum and the posterior abdominal wall."]
beden:
  camera: front
  look: trunk-veins
  layers: [skin, heart, veins, skeleton]
  parts:
    highlight: [superior-vena-cava, inferior-vena-cava, brachiocephalic-veins, internal-jugular-veins, subclavian-veins, hepatic-veins, renal-veins, common-iliac-veins, azygos-vein]
    ghost: [skin, heart, skeleton]
    hide: [superficial-veins, deep-leg-veins, axillary-veins, external-iliac-veins]
    flow: [common-iliac-veins, inferior-vena-cava, heart]
  structure: vena-cava
  labels:
    - { part: superior-vena-cava, text: "superior vena cava" }
    - { part: inferior-vena-cava, text: "inferior vena cava" }
    - { part: internal-jugular-veins, text: "internal jugular" }
    - { part: azygos-vein, text: "azygos" }
