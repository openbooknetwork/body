title: "The portal system"
sources: ["Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), chapter on the liver.", "Arthur Guyton and John Hall, Textbook of Medical Physiology, 13th ed. (2016), ch. 71."]
beden:
  camera: front
  look: portal-system
  distance: 0.8
  layers: [organs, portal, veins, skeleton]
  parts:
    highlight: [superior-mesenteric-vein, inferior-mesenteric-vein, splenic-vein, portal-vein, hepatic-veins]
    ghost: [liver, skeleton, right-kidney, left-kidney, spleen]
    hide: [brain, superficial-veins, deep-leg-veins, arm-veins, leg-veins, internal-jugular-veins, brachiocephalic-veins, superior-vena-cava]
    flow: [superior-mesenteric-vein, portal-vein, hepatic-veins, inferior-vena-cava]
  labels:
    - { part: superior-mesenteric-vein, text: "superior mesenteric vein" }
    - { part: splenic-vein, text: "splenic vein" }
    - { part: portal-vein, text: "portal vein" }
    - { part: hepatic-veins, text: "hepatic veins" }
