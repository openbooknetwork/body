title: "The bandaged arm"
sources: ["William Harvey, Exercitatio anatomica de motu cordis et sanguinis in animalibus (1628), ch. 9 and 13."]
beden:
  camera: front
  look: arm-veins
  distance: 1.2
  layers: [skin, veins, skeleton]
  parts:
    highlight: [cephalic-veins, basilic-veins, median-cubital-veins]
    ghost: [skin, skeleton]
    hide: [hepatic-veins, renal-veins, common-iliac-veins, external-iliac-veins, femoral-veins, popliteal-veins, great-saphenous-veins, inferior-vena-cava, azygos-vein]
  labels:
    - { part: cephalic-veins, text: "cephalic" }
    - { part: basilic-veins, text: "basilic" }
    - { part: median-cubital-veins, text: "median cubital" }
