title: "Head and arms"
sources: ["Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), chapters on the great vessels and the neck."]
beden:
  camera: front
  look: arch-branches
  distance: 0.45
  layers: [heart, aorta, arteries, skeleton]
  parts:
    highlight: [brachiocephalic-artery, right-common-carotid-artery, left-common-carotid-artery, right-subclavian-artery, left-subclavian-artery, cervical-internal-carotid-arteries, external-carotid-arteries, vertebral-arteries]
    ghost: [heart, skeleton, ascending-aorta, descending-aorta]
    hide: [abdominal-aorta, internal-carotid-arteries]
    flow: [arch-of-aorta, brachiocephalic-artery, right-common-carotid-artery, cervical-internal-carotid-arteries]
  labels:
    - { part: brachiocephalic-artery, text: "brachiocephalic trunk" }
    - { part: right-common-carotid-artery, text: "right common carotid" }
    - { part: left-common-carotid-artery, text: "left common carotid" }
    - { part: left-subclavian-artery, text: "left subclavian" }
    - { part: external-carotid-arteries, text: "external carotid" }
