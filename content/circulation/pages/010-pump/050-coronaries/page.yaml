title: "The heart's own arteries"
sources: ["Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), chapter on the heart.", "Arthur Guyton and John Hall, Textbook of Medical Physiology, 13th ed. (2016), ch. 21."]
beden:
