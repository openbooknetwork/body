# The 206 bones of the adult body and the joints between them. The pages cover bone as a living tissue, the skull, the spine, the rib cage, the arms and legs, the kinds of joint, and how bones grow, heal and thin with age. They end with the anatomy of Vesalius and the first X-rays of Röntgen.
story.summary: "Yetişkin bedenin 206 kemiği ve aralarındaki eklemler. Sayfalar canlı bir doku olarak kemiği, kafatasını, omurgayı, göğüs kafesini, kolları ve bacakları, eklem türlerini ve kemiklerin nasıl büyüyüp iyileştiğini ve yaşla nasıl inceldiğini anlatır. Vesalius’un anatomisi ve Röntgen’in ilk X ışınlarıyla biter."

# The skeletal system
story.title: "İskelet sistemi"
