title: "A slipped disc"
sources: ["Susan Standring (ed.), Gray's Anatomy, 42nd ed. (2020), chapter on the back.", "Allan Ropper and Ross Zafonte, Sciatica, New England Journal of Medicine 372 (2015): 1240 to 1248."]
